<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>English Vocab</title>
	</head>
	<body>
		<h1>Vocab List</h1>
		<div id="vocabsContainer">
		</div>
		<script>
			var vocabs = [
				"Cat",
				"Dog",
				"Bat"
			];
			var ul = '<ul>'
			vocabs.forEach(function(vocab){
				ul += `
					<li>
						<span class="vocab-word">${vocab}</span>
						<button onclick ="speakWord('${vocab}')"></button>
					</li>

				`;

			});
			ul += '</ul>';
			document.getElementById("vocabsContainer").innerHTML = ul;
		</script>
	</body>
</html>
