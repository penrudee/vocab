<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name='viewport' content='width=device-width, initial-scale=1.0' />
	<link rel="stylesheet" href="https://cdn.datatables.net/v/dt/dt-3.1.4/datatables.min.css">
	<link rel="icon" type="image/svg+xml" href="favicon.svg">
	<script src="https://cdn.datatables.net/v/dt/dt-3.1.4/datatables.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	<title>English Vocab</title>
</head>

<body>
	<header class="topbar">
		<nav class="bg-neutral-primary fixed w-full z-20 top-0 start-0 border-default">
			<div class="max-w-acreen-xl flex flex-wrap items-center justify-between mx-auto p-4">
				<a href="https://s.shopee.co.th/AKbN3fMT7U" class="navbar-brand" id="affiliated">
					📖
					<span class="self-center text-xl text-heading font-semibold whitespace-nowrap">หนังสือ ตะลุยโจทย์
						Vocab 1,000 ข้อ</span>
				</a>
			</div>
		</nav>
	</header>
	<main id="tableContainer" class="table-container pt-20">
		<div class="container">


			<table id="vocabsTable" class="display w-full">
				<thead>
					<tr>
						<th>คำศัพท์</th>
						<th>ประเภทคำ</th>
						<th>คำอ่าน</th>
						<th>ความหมาย</th>

					</tr>
				</thead>
				<tbody>

				</tbody>
			</table>

			<script>
				var url = "vocab1.csv"
				fetch(url)
					.then((response) => response.text())
					.then(data => {
						const lines = data.split('\n').filter(line => line.trim() !== '');
						var rows = '';

						for (let i = 1; i < lines.length; i++) {
							const cols = lines[i].split(',');
							if (cols.length >= 4) {
								const vocab = cols[0].trim();
								const pos = cols[1].trim();
								const phonetics = cols[2].trim();
								const meaning = cols[3].trim();


								rows += `<tr>
                                    <td><span class="vocab-word font-semibold">${vocab}</span></td>
                                    <td>${pos}</td>
                                    <td>
                                        ${phonetics} 
                                        <button onclick="speakWord('${vocab}')" class="ml-2 cursor-pointer">🔊</button>
                                    </td>
                                    <td>${meaning}</td>
									
                                </tr>`;
							}
						}

						// 1. นำข้อมูลใส่เข้าไปใน <tbody>
						document.querySelector("#vocabsTable tbody").innerHTML = rows;

						// 2. เรียกใช้งาน DataTable หลังจากข้อมูลใส่ลงตารางเรียบร้อยแล้ว
						new DataTable('#vocabsTable', {
							pageLength: 25
						});
					})
					.catch(error => {
						console.error('Error loading CSV file:', error);
					});

				function speakWord(word) {
					if ('speechSynthesis' in window) {
						window.speechSynthesis.cancel();
						const utterace = new SpeechSynthesisUtterance(word);
						utterace.lang = 'en-US';
						utterace.rate = 1.0;
						utterace.pitch = 1.0;
						window.speechSynthesis.speak(utterace);
					} else {
						alert('เบราเซอร์ของคุณไม่รองรับการสังเคราะห์เสียงพูด');
					}
				};
			</script>
		</div>
	</main>
</body>

</html>
