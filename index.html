<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name='viewport' content='width=device-width, initial-scal3=1.0'/>
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<title>English Vocab</title>
	</head>
	<body>
		<div id='main' class='container mx-auto px-4'>
		<h1 class='text-3xl font-bold'>Vocab List</h1>
		<div id="vocabsContainer">
		</div>
		<script>
			var vocabs = [
				"Cat",
				"Dog",
				"Bat"
			];
			var ul = '<ul>'
			vocabs.forEach(function(vocab){
				ul += `
					<li>
						<span class="vocab-word">${vocab}: </span>
						<button onclick ="speakWord('${vocab}')">Speak</button>
					</li>

				`;

			});
			ul += '</ul>';
			document.getElementById("vocabsContainer").innerHTML = ul;
			function speakWord(word){
				if('speechSynthesis' in window){

					window.speechSynthesis.cancel();
					//create text to speech
					const utterace = new SpeechSynthesisUtterance(word);
					//config speech to eng
					utterace.lang = 'en-US';
					//config speech rate
					utterace.rate=1.0;  //0.1-10
					utterace.pitch=1.0; // 0-2

					//start speech
					window.speechSynthesis.speak(utterace);
				}else{
					alert('เบราเซอร์ของคุณไม่รองรับการสังเคราะห์เสียงพูด');
				}

			};
		</script>
		</div>
	</body>
</html>
